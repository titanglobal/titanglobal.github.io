<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>404 - Page Not Found | Titan Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #1F1346;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
        }
        .container { max-width: 500px; }
        h1 { font-family: 'Manrope', sans-serif; font-size: 120px; font-weight: 700; color: #8c85ff; line-height: 1; margin-bottom: 10px; }
        h2 { font-family: 'Manrope', sans-serif; font-size: 28px; margin-bottom: 16px; color: #fff; }
        p { color: rgba(255,255,255,0.7); margin-bottom: 32px; line-height: 1.6; }
        a {
            display: inline-block;
            padding: 14px 32px;
            background: #673de6;
            color: #fff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: background 0.3s;
        }
        a:hover { background: #5025d1; }
    </style>
</head>
<body>
    <div class="container">
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist or has been moved.</p>
        <a href="index.html">Back to Home</a>
    </div>
</body>
</html>
