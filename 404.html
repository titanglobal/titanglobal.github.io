<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>404 - Page Not Found | Titan Group</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Manrope:wght@400;700&display=swap" rel="stylesheet"/>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: 'Inter', sans-serif;
            background: #111827;
            color: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            text-align: center;
            padding: 40px 20px;
        }
        .container { max-width: 520px; }
        .logo {
            font-family: 'Manrope', sans-serif;
            font-size: 22px;
            font-weight: 700;
            color: #f4f6f9;
            margin-bottom: 32px;
            letter-spacing: 0.05em;
        }
        .logo span { color: #2f80c2; }
        h1 { font-family: 'Manrope', sans-serif; font-size: 120px; font-weight: 700; color: #2f80c2; line-height: 1; margin-bottom: 8px; }
        h2 { font-family: 'Manrope', sans-serif; font-size: 28px; font-weight: 700; margin-bottom: 12px; color: #f4f6f9; }
        p { color: rgba(244,246,249,0.7); margin-bottom: 32px; line-height: 1.6; font-size: 16px; }
        .links { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
        a.btn-primary {
            display: inline-block;
            padding: 14px 32px;
            background: #2f80c2;
            color: #fff;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background 0.3s;
        }
        a.btn-primary:hover { background: #5899ce; color: #000; }
        a.btn-secondary {
            display: inline-block;
            padding: 14px 32px;
            background: #e1e4e8;
            color: #000;
            text-decoration: none;
            border-radius: 4px;
            font-weight: 600;
            transition: background 0.3s;
        }
        a.btn-secondary:hover { background: #b4b6b9; }
        .tagline { margin-top: 40px; font-size: 13px; color: rgba(244,246,249,0.4); letter-spacing: 0.1em; text-transform: uppercase; }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">Titan <span>Group</span></div>
        <h1>404</h1>
        <h2>Page Not Found</h2>
        <p>The page you're looking for doesn't exist, has been moved, or the link you followed may be incorrect.</p>
        <div class="links">
            <a class="btn-primary" href="index.html">Back to Home</a>
            <a class="btn-secondary" href="contact.html">Contact Us</a>
        </div>
        <div class="tagline">Resource to market. Extraction to delivery.</div>
    </div>
</body>
</html>
